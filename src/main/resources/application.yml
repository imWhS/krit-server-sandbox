spring:
  datasource:
    url: jdbc:h2:mem:krit
    username: sa
    password: ""
  application:
    name: krit-server-sandbox
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    org.hibernate.orm.jdbc.bind: off

decorator:
  datasource:
    p6spy:
      enable-logging: true